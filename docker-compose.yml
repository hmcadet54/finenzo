services:
  finenzo-server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Karachi}
      NODE_ENV: production
    ports:
      - '4000:4000'

  finenzo-client:
    build:
      context: ./client
      args:
        # Baked into the static bundle at build time.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - finenzo-server
    ports:
      - '8080:80'
